  /3/discover/movie:
    get:
      tags: [Discover]
      summary: Discover movies
      operationId: discoverMovies
      description: Filters and sorts movies. All filters are optional.
      parameters:
        - name: certification
          in: query
          description: Certification to match. Needs certification_country.
          schema:
            type: string
          example: R
        - name: certification.gte
          in: query
          description: Certification greater than or equal to this value.
          schema:
            type: string
          example: PG
        - name: certification.lte
          in: query
          description: Certification less than or equal to this value.
          schema:
            type: string
          example: R
        - name: certification_country
          in: query
          description: ISO 3166-1 country code of the certification.
          schema:
            type: string
          example: US
        - $ref: '#/components/parameters/include_adult'
        - name: include_video
          in: query
          description: Include entries marked as video.
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/language'
        - $ref: '#/components/parameters/page'
        - name: primary_release_year
          in: query
          description: Year of the first release.
          schema:
            type: integer
          example: 2010
        - name: primary_release_date.gte
          in: query
          description: First release on or after this date.
          schema:
            type: string
            format: date
          example: '2025-01-01'
        - name: primary_release_date.lte
          in: query
          description: First release on or before this date.
          schema:
            type: string
            format: date
          example: '2025-01-01'
        - $ref: '#/components/parameters/region'
        - name: release_date.gte
          in: query
          description: Release on or after this date.
          schema:
            type: string
            format: date
          example: '2025-01-01'
        - name: release_date.lte
          in: query
          description: Release on or before this date.
          schema:
            type: string
            format: date
          example: '2025-01-01'
        - name: sort_by
          in: query
          description: Sort order.
          schema:
            type: string
            default: popularity.desc
            enum: [original_title.asc, original_title.desc, popularity.asc, popularity.desc, revenue.asc, revenue.desc, primary_release_date.asc, primary_release_date.desc, title.asc, title.desc, vote_average.asc, vote_average.desc, vote_count.asc, vote_count.desc]
        - name: vote_average.gte
          in: query
          description: Vote average greater than or equal to this value.
          schema:
            type: number
          example: 7
        - name: vote_average.lte
          in: query
          description: Vote average less than or equal to this value.
          schema:
            type: number
          example: 9
        - name: vote_count.gte
          in: query
          description: Vote count greater than or equal to this value.
          schema:
            type: integer
          example: 100
        - name: vote_count.lte
          in: query
          description: Vote count less than or equal to this value.
          schema:
            type: integer
          example: 10000
        - name: watch_region
          in: query
          description: ISO 3166-1 country code for the watch provider filters.
          schema:
            type: string
            pattern: ^[A-Z]{2}$
          example: US
        - name: with_cast
          in: query
          description: Person ids in the cast. Comma separated ids match all of them. Pipe separated ids match any of them.
          schema:
            type: string
          example: '287'
        - name: with_companies
          in: query
          description: Company ids. Comma separated ids match all of them. Pipe separated ids match any of them.
          schema:
            type: string
          example: '1'
        - name: with_crew
          in: query
          description: Person ids in the crew. Comma separated ids match all of them. Pipe separated ids match any of them.
          schema:
            type: string
          example: '7467'
        - name: with_genres
          in: query
          description: Genre ids. Comma separated ids match all of them. Pipe separated ids match any of them.
          schema:
            type: string
          example: '18'
        - name: with_keywords
          in: query
          description: Keyword ids. Comma separated ids match all of them. Pipe separated ids match any of them.
          schema:
            type: string
          example: '818'
        - name: with_origin_country
          in: query
          description: ISO 3166-1 country code of origin.
          schema:
            type: string
          example: US
        - name: with_original_language
          in: query
          description: ISO 639-1 original language code.
          schema:
            type: string
          example: en
        - name: with_people
          in: query
          description: Person ids in the cast or crew. Comma separated ids match all of them. Pipe separated ids match any of them.
          schema:
            type: string
          example: '287'
        - name: with_release_type
          in: query
          description: Release types to match, for example 2|3. Same codes as release_dates.
          schema:
            type: string
          example: 2|3
        - name: with_runtime.gte
          in: query
          description: Runtime in minutes, at least.
          schema:
            type: integer
          example: 90
        - name: with_runtime.lte
          in: query
          description: Runtime in minutes, at most.
          schema:
            type: integer
          example: 180
        - name: with_watch_monetization_types
          in: query
          description: 'Offer types: flatrate, free, ads, rent or buy. Needs watch_region.'
          schema:
            type: string
          example: flatrate
        - name: with_watch_providers
          in: query
