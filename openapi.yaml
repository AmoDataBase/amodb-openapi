  /omdb/:
    get:
      tags: [OMDb]
      summary: Look up or search titles
      operationId: queryOmdb
      description: OMDb compatible route. Send i for an IMDb id, t for a title, or s to search. Every value in the response is a string. A lookup that finds nothing returns HTTP 200 with Response False. The trailing slash is optional.
      security:
        - apikey: []
      parameters:
        - name: i
          in: query
          description: IMDb id. Returns one title.
          schema:
            type: string
            pattern: ^tt[0-9]+$
          example: tt0137523
        - name: t
          in: query
          description: Title to look up. Returns one title.
          schema:
            type: string
          example: Fight Club
        - name: s
          in: query
          description: Title to search for. Returns a page of results.
          schema:
            type: string
          example: inception
        - name: type
          in: query
          description: Kind of title.
          schema:
            type: string
            enum: [movie, series, episode]
          example: movie
        - name: 'y'
          in: query
          description: Release year.
          schema:
            type: string
            pattern: ^[0-9]{4}$
          example: '1999'
        - name: plot
          in: query
          description: Length of the Plot field.
          schema:
            type: string
            enum: [short, full]
            default: short
        - name: page
          in: query
          description: Page of search results. Used with s.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 1
        - name: r
          in: query
          description: Response format. Only json is offered. xml returns 400.
          schema:
            type: string
            enum: [json]
            default: json
      responses:
        '200':
          description: One title, a page of search results, or an OMDb error with Response False.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/OmdbTitle'
                  - $ref: '#/components/schemas/OmdbSearchResult'
                  - $ref: '#/components/schemas/OmdbError'
              examples:
                title:
                  summary: Lookup by IMDb id
                  value:
                    Title: Fight Club
                    Year: '1999'
                    Rated: R
                    Released: 15 Oct 1999
                    Runtime: 139 min
                    Genre: Drama
                    Director: David Fincher
                    Writer: Chuck Palahniuk, Jim Uhls
                    Actors: Brad Pitt, Edward Norton, Meat Loaf
                    Plot: An insomniac office worker and a soap maker start an underground fight club.
                    Language: English
                    Country: United States, Germany
                    Awards: Nominated for 1 Oscar. 11 wins & 38 nominations total
                    Poster: https://img.amodb.dev/t/p/w300/pB8BM7pdSp6B6Ih7QZ4DrQ3PmJK.jpg
                    Ratings:
                      - Source: Internet Movie Database
                        Value: 8.8/10
                    Metascore: '67'
                    imdbRating: '8.8'
                    imdbVotes: 2,300,000
                    imdbID: tt0137523
                    Type: movie
                    DVD: N/A
                    BoxOffice: $37,030,102
                    Production: N/A
                    Website: N/A
                    Response: 'True'
                search:
                  summary: Search
                  value:
                    Search:
                      - Title: Inception
                        Year: '2010'
                        imdbID: tt1375666
                        Type: movie
                        Poster: https://img.amodb.dev/t/p/w300/9gk7adHYeDvHkCSEqAvQNLV5Uge.jpg
                    totalResults: '1'
                    Response: 'True'
                notFound:
                  summary: Nothing found
                  value:
                    Response: 'False'
                    Error: Movie not found!
        '400':
          description: Bad request, for example r=xml.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OmdbError'
              example:
                Response: 'False'
                Error: Only json is offered.
        '401':
          description: The key is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OmdbError'
              example:
                Response: 'False'
                Error: Invalid API key!
        '429':
          description: The key went over its requests per minute. Wait Retry-After seconds.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OmdbError'
              example:
                Response: 'False'
                Error: Request limit reached!
  /t/p/{size}/{file}:
    get:
      tags: [Images]
      summary: Get an image
      operationId: getImage
      description: Serves an image on the img.amodb.dev host. No key is needed. Build the path from images.secure_base_url in /3/configuration, a size and the file_path of an image without its leading slash.
      security: []
      servers:
        - url: https://img.amodb.dev
          description: Image host
      parameters:
        - name: size
          in: path
          required: true
          description: Image size. w is the width in pixels, h632 is the height, original is the source file.
          schema:
            type: string
            enum: [w92, w154, w185, w300, w342, w500, w780, w1280, h632, original]
          example: w500
        - name: file
          in: path
          required: true
          description: File name from a file_path, without the leading slash.
          schema:
            type: string
          example: pB8BM7pdSp6B6Ih7QZ4DrQ3PmJK.jpg
      responses:
        '200':
          description: The image bytes. Responses are cached for a long time.
          headers:
            Cache-Control:
              description: Long lived cache directive.
              schema:
                type: string
              example: public, max-age=2592000
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /plans:
    get:
      tags: [Plans]
      summary: List plans
      operationId: getPlans
      description: Public list of plans, billing periods and prices. No key is needed. The example values are illustrative. Live names and prices come from this endpoint.
      security: []
      responses:
        '200':
          description: Plans and billing periods.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plans'
              example:
                currency: USD
                periods:
                  - id: m1
                    months: 1
                    save: 0
                  - id: m6
                    months: 6
                    save: 10
                  - id: m12
                    months: 12
                    save: 20
                plans:
                  - id: lite
                    name: Lite
                    rpm: 20
                    monthlyCents: 900
                    totals:
                      m1: 900
                      m6: 4860
                      m12: 8640
                  - id: pro
                    name: Pro
                    rpm: 40
                    monthlyCents: 1900
                    totals:
                      m1: 1900
                      m6: 10260
                      m12: 18240
                  - id: proplus
                    name: Pro Plus
                    rpm: 120
                    monthlyCents: 4900
                    totals:
                      m1: 4900
                      m6: 26460
                      m12: 47040
                fetchedAt: '2026-10-18T09:00:00.000Z'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  schemas:
    Error:
      type: object
      description: Error body used by every TMDB style route. The status_code values are listed in the responses of this document.
      required: [success, status_code, status_message]
      properties:
        success:
          type: boolean
          const: false
        status_code:
          type: integer
          description: 'amodb status code. Known values: 7, 10, 11, 24, 25, 34, 36 and 37.'
        status_message:
          type: string
      example:
        success: false
        status_code: 34
        status_message: The resource you requested could not be found.
    Genre:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
      required: [id, name]
      example:
        id: 18
        name: Drama
    GenreList:
      type: object
      properties:
        genres:
          type: array
          items:
            $ref: '#/components/schemas/Genre'
      required: [genres]
    Image:
      type: object
      properties:
        aspect_ratio:
          type: number
        height:
          type: integer
        width:
          type: integer
        file_path:
          type: string
          description: Append to the image base URL and a size, for example /t/p/w500/{file_path}.
        iso_639_1:
          type: [string, 'null']
        vote_average:
          type: number
        vote_count:
          type: integer
      required: [file_path]
      additionalProperties: true
    Images:
      type: object
      properties:
        id:
          type: integer
        backdrops:
          type: array
          items:
            $ref: '#/components/schemas/Image'
        logos:
          type: array
          items:
            $ref: '#/components/schemas/Image'
        posters:
          type: array
          items:
            $ref: '#/components/schemas/Image'
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/Image'
        stills:
          type: array
