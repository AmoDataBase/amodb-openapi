          description: Vote average less than or equal to this value.
          schema:
            type: number
          example: 9
        - name: vote_count.gte
          in: query
          description: Vote count greater than or equal to this value.
          schema:
            type: integer
          example: 100
        - name: vote_count.lte
          in: query
          description: Vote count less than or equal to this value.
          schema:
            type: integer
          example: 10000
        - name: watch_region
          in: query
          description: ISO 3166-1 country code for the watch provider filters.
          schema:
            type: string
            pattern: ^[A-Z]{2}$
          example: US
        - name: with_companies
          in: query
          description: Company ids. Comma separated ids match all of them. Pipe separated ids match any of them.
          schema:
            type: string
          example: '1'
        - name: with_genres
          in: query
          description: Genre ids. Comma separated ids match all of them. Pipe separated ids match any of them.
          schema:
            type: string
          example: '18'
        - name: with_keywords
          in: query
          description: Keyword ids. Comma separated ids match all of them. Pipe separated ids match any of them.
          schema:
            type: string
          example: '818'
        - name: with_networks
          in: query
          description: Network ids. Comma separated ids match all of them. Pipe separated ids match any of them.
          schema:
            type: string
          example: '49'
        - name: with_origin_country
          in: query
          description: ISO 3166-1 country code of origin.
          schema:
            type: string
          example: US
        - name: with_original_language
          in: query
          description: ISO 639-1 original language code.
          schema:
            type: string
          example: en
        - name: with_runtime.gte
          in: query
          description: Episode runtime in minutes, at least.
          schema:
            type: integer
          example: 90
        - name: with_runtime.lte
          in: query
          description: Episode runtime in minutes, at most.
          schema:
            type: integer
          example: 180
        - name: with_status
          in: query
          description: 'Status ids: 0 returning, 1 planned, 2 in production, 3 ended, 4 canceled, 5 pilot.'
          schema:
            type: string
          example: '3'
        - name: with_type
          in: query
          description: 'Type ids: 0 documentary, 1 news, 2 miniseries, 3 reality, 4 scripted, 5 talk show, 6 video.'
          schema:
            type: string
          example: '4'
        - name: with_watch_monetization_types
          in: query
          description: 'Offer types: flatrate, free, ads, rent or buy. Needs watch_region.'
          schema:
            type: string
          example: flatrate
        - name: with_watch_providers
          in: query
          description: Watch provider ids. Needs watch_region. Comma separated ids match all of them. Pipe separated ids match any of them.
          schema:
            type: string
          example: '8'
        - name: without_companies
          in: query
          description: Company ids to exclude. Comma separated ids match all of them. Pipe separated ids match any of them.
          schema:
            type: string
          example: '1'
        - name: without_genres
          in: query
          description: Genre ids to exclude. Comma separated ids match all of them. Pipe separated ids match any of them.
          schema:
            type: string
          example: '27'
        - name: without_keywords
          in: query
          description: Keyword ids to exclude. Comma separated ids match all of them. Pipe separated ids match any of them.
          schema:
            type: string
          example: '818'
        - name: without_watch_providers
          in: query
          description: Watch provider ids to exclude. Comma separated ids match all of them. Pipe separated ids match any of them.
          schema:
            type: string
          example: '8'
