                certification:
                  type: string
                meaning:
                  type: string
                order:
                  type: integer
              required: [certification, meaning, order]
      required: [certifications]
    RatingValue:
      type: object
      properties:
        value:
          type: number
          description: 'Score on the provider scale: out of 10 for imdb, kinopoisk and tmdb, out of 100 for metacritic and rotten_tomatoes.'
        votes:
          type: [integer, 'null']
          description: Number of votes behind the score, null when the provider does not publish it.
      required: [value, votes]
    RatingsSection:
      type: object
      description: Ratings by provider. A provider with a missing or zero score is null. The key order is imdb, kinopoisk, metacritic, rotten_tomatoes, tmdb.
      properties:
        imdb:
          description: IMDb score out of 10, one decimal.
          anyOf:
            - $ref: '#/components/schemas/RatingValue'
            - type: 'null'
        kinopoisk:
          description: Kinopoisk score out of 10, one decimal.
          anyOf:
            - $ref: '#/components/schemas/RatingValue'
            - type: 'null'
        metacritic:
          description: Metacritic score out of 100, an integer. votes is null.
          anyOf:
            - $ref: '#/components/schemas/RatingValue'
            - type: 'null'
        rotten_tomatoes:
          description: Rotten Tomatoes score out of 100, an integer. votes is null.
          anyOf:
            - $ref: '#/components/schemas/RatingValue'
            - type: 'null'
        tmdb:
          description: TMDB score out of 10, three decimals.
          anyOf:
            - $ref: '#/components/schemas/RatingValue'
            - type: 'null'
      required: [imdb, kinopoisk, metacritic, rotten_tomatoes, tmdb]
    Ratings:
      description: Ratings of a title from several providers.
      allOf:
        - type: object
          properties:
            id:
              type: integer
          required: [id]
        - $ref: '#/components/schemas/RatingsSection'
    MoodsSection:
      type: object
      description: Mood meters. source is omitted for a title that is not in the amodb catalog.
      properties:
        source:
          type: [string, 'null']
          enum: [measured, estimated, null]
          description: measured is built from viewer readings. estimated is derived from the genres. null when the title has no mood data.
        results:
          type: array
          items:
            $ref: '#/components/schemas/Mood'
          description: Sorted by name. Not every title has every mood.
      required: [results]
    Mood:
      type: object
      properties:
        name:
          type: string
          description: action, fear, humor, pace, profanity, romance, sadness, sex or violence.
        avg:
          type: number
          description: Mean on a scale from 0 to 10, one decimal. An integer for estimated moods.
        values:
          type: array
          items:
            type: number
          description: Up to 24 readings on the same 0 to 10 scale. Measured titles have 6, estimated titles have 5.
      required: [name, avg, values]
    Moods:
      description: Mood meters for a title.
      allOf:
        - type: object
          properties:
            id:
              type: integer
          required: [id]
        - $ref: '#/components/schemas/MoodsSection'
    SoundtrackTrack:
      type: object
      properties:
        disc:
          type: integer
        number:
          type: integer
        title:
          type: string
        artist:
          type: string
        duration_ms:
          type: integer
          description: Length in milliseconds. 0 when unknown.
      required: [disc, number, title, artist, duration_ms]
    SoundtrackAlbum:
      type: object
      properties:
        source:
          type: string
          enum: [musicbrainz, deezer]
          description: Where the album data comes from.
        album:
          type: string
        artist:
          type: [string, 'null']
        released:
          type: [string, 'null']
          description: Release date, YYYY-MM-DD or a shorter prefix.
        url:
          type: [string, 'null']
          description: Page of the album at the source.
        track_count:
          type: integer
        tracks:
          type: array
          items:
            $ref: '#/components/schemas/SoundtrackTrack'
      required: [source, album, artist, released, url, track_count, tracks]
    SoundtracksSection:
      type: object
      description: Soundtrack listing.
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SoundtrackAlbum'
          description: At most one album today. Empty when no album is known.
      required: [results]
    Soundtracks:
      description: Soundtrack listing of a title.
      allOf:
        - type: object
          properties:
            id:
              type: integer
          required: [id]
        - $ref: '#/components/schemas/SoundtracksSection'
    WikidataMoney:
      type: object
      properties:
        value:
          type: integer
          description: Amount rounded to a whole number.
        currency:
          type: [string, 'null']
          description: ISO 4217 code, null when unknown.
      required: [value, currency]
    WikidataBoxOffice:
      type: object
      properties:
        value:
          type: integer
          description: Amount rounded to a whole number.
        currency:
          type: [string, 'null']
          description: ISO 4217 code, null when unknown.
        worldwide:
          type: boolean
          description: true when the amount covers all markets.
      required: [value, currency, worldwide]
    WikidataLink:
      type: object
      description: Reference to a Wikidata item.
      properties:
        wikidata_id:
          type: string
          pattern: ^Q[0-9]+$
          description: Wikidata item id.
        label:
          type: [string, 'null']
          description: Name in the request language, falling back to English.
        tmdb_id:
          type: integer
          description: Id of the title in the catalog. Present only when the item is a catalog title.
        media_type:
          type: string
          enum: [movie, tv]
          description: Kind of the catalog title. Present only together with tmdb_id.
      required: [wikidata_id, label]
    WikidataEntry:
      type: object
      description: Linked item of an award, nomination or location group.
      properties:
        wikidata_id:
          type: string
          pattern: ^Q[0-9]+$
          description: Wikidata item id.
        label:
          type: [string, 'null']
          description: Name in the request language, falling back to English.
        tmdb_id:
          type: integer
          description: Id of the title in the catalog. Present only when the item is a catalog title.
        media_type:
          type: string
          enum: [movie, tv]
          description: Kind of the catalog title. Present only together with tmdb_id.
        year:
          type: integer
          description: Year, present when Wikidata gives one.
      required: [wikidata_id, label]
    WikidataBasedOn:
      type: object
      description: Work the title is based on.
      properties:
        wikidata_id:
          type: string
          pattern: ^Q[0-9]+$
          description: Wikidata item id.
        label:
          type: [string, 'null']
          description: Name in the request language, falling back to English.
        tmdb_id:
          type: integer
          description: Id of the title in the catalog. Present only when the item is a catalog title.
        media_type:
          type: string
          enum: [movie, tv]
          description: Kind of the catalog title. Present only together with tmdb_id.
        year:
          type: integer
          description: Year, when known.
        author:
          description: Author of the source work, null when unknown.
          anyOf:
            - $ref: '#/components/schemas/WikidataLink'
            - type: 'null'
      required: [wikidata_id, label, author]
    Wikidata:
      type: object
      description: Facts from Wikidata. Empty groups are []. The id is kept inside append_to_response.
      properties:
        id:
          type: integer
        wikidata_id:
          type: [string, 'null']
        budget:
          anyOf:
            - $ref: '#/components/schemas/WikidataMoney'
            - type: 'null'
        box_office:
          anyOf:
            - $ref: '#/components/schemas/WikidataBoxOffice'
            - type: 'null'
        follows:
          description: Previous title of the series.
          anyOf:
            - $ref: '#/components/schemas/WikidataLink'
            - type: 'null'
        followed_by:
          description: Next title of the series.
          anyOf:
            - $ref: '#/components/schemas/WikidataLink'
            - type: 'null'
        sitelinks:
          type: object
          description: Wikipedia page titles keyed by language code. Only the 14 served languages are listed.
          additionalProperties:
            type: string
        awards:
          type: array
          items:
            $ref: '#/components/schemas/WikidataEntry'
        nominations:
          type: array
          items:
            $ref: '#/components/schemas/WikidataEntry'
        based_on:
          type: array
          items:
            $ref: '#/components/schemas/WikidataBasedOn'
        filming_locations:
          type: array
          items:
            $ref: '#/components/schemas/WikidataEntry'
        narrative_locations:
          type: array
          items:
            $ref: '#/components/schemas/WikidataEntry'
        original_broadcasters:
          type: array
          items:
            $ref: '#/components/schemas/WikidataEntry'
      required: [id, wikidata_id, budget, box_office, follows, followed_by, sitelinks, awards, nominations, based_on, filming_locations, narrative_locations, original_broadcasters]
    ShowtimeCountry:
      type: object
      properties:
        country:
          type: string
          description: ISO 3166-1 country code.
        name:
          type: string
        venues:
          type: integer
        cities:
          type: integer
        showtimes:
          type: integer
        first_day:
          type: string
          format: date
        last_day:
          type: string
          format: date
      required: [country, name, venues, cities, showtimes, first_day, last_day]
    Showtime:
      type: object
      properties:
        date:
          type: string
          format: date
          description: Day of the screening at the venue.
        start:
          type: string
          description: Start in venue local time without an offset, for example 2026-10-18T21:40.
        end:
          type: [string, 'null']
        auditorium:
          type: [string, 'null']
        formats:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string
        audio:
          type: [string, 'null']
        subtitles:
          type: [string, 'null']
        language:
          type: [string, 'null']
        price:
          type: [number, 'null']
        currency:
          type: [string, 'null']
        prices:
          description: Price list as the venue publishes it, or null. The structure differs between venues, so it has no fixed schema.
        booking_url:
          type: [string, 'null']
        sold_out:
          type: boolean
      required: [date, start, end, auditorium, formats, tags, audio, subtitles, language, price, currency, prices, booking_url, sold_out]
    CinemaVenue:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        chain:
          type: object
          properties:
            key:
              type: string
            name:
              type: [string, 'null']
          required: [key, name]
        city:
          type: [string, 'null']
        region:
          type: [string, 'null']
        address:
          type: [string, 'null']
        postal_code:
          type: [string, 'null']
        country:
          type: string
          description: ISO 3166-1 country code.
        timezone:
          type: [string, 'null']
        latitude:
          type: [number, 'null']
        longitude:
          type: [number, 'null']
        phone:
          type: [string, 'null']
        url:
          type: [string, 'null']
        showtimes:
          type: array
          items:
            $ref: '#/components/schemas/Showtime'
      required: [id, name, chain, city, region, address, postal_code, country, timezone, latitude, longitude, phone, url, showtimes]
    Showtimes:
      type: object
      description: Cinema screenings from today on. The id is kept inside append_to_response.
      properties:
        id:
          type: integer
        country:
          type: [string, 'null']
          description: ISO 3166-1 code of the requested country. null when no valid country was given.
        results:
          type: array
          items:
            $ref: '#/components/schemas/CinemaVenue'
          description: Venues with their screenings, ordered by venue then start time, at most 1500 screenings in total. Empty when no country was given.
        countries:
          type: array
          items:
            $ref: '#/components/schemas/ShowtimeCountry'
          description: Per country totals, most screenings first, at most 60 countries. Only countries with screenings today or later.
      required: [id, country, results, countries]
    Plans:
      type: object
      properties:
        currency:
          type: string
          description: ISO 4217 currency code of all amounts.
        periods:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: Billing period id used as a key in totals.
              months:
                type: integer
              save:
                type: number
                description: Discount for paying this period up front compared with paying monthly.
            required: [id, months, save]
        plans:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: 'Plan id: lite, pro or proplus.'
              name:
                type: string
              rpm:
                type: integer
                description: Requests per minute for each key on this plan.
              monthlyCents:
                type: integer
                description: Price of one month in cents.
              totals:
                type: object
                description: Total price in cents for each billing period id.
                additionalProperties:
                  type: integer
            required: [id, name, rpm, monthlyCents, totals]
        fetchedAt:
          type: string
          format: date-time
          description: When the plan data was read.
      required: [currency, periods, plans, fetchedAt]
    OmdbRating:
      type: object
      properties:
        Source:
          type: string
        Value:
          type: string
      required: [Source, Value]
    OmdbMovie:
      type: object
      description: One movie. Every value is a string. Missing values are the string N/A.
      properties:
        Title:
          type: string
        Year:
          type: string
        Rated:
          type: string
        Released:
          type: string
        Runtime:
          type: string
        Genre:
          type: string
        Director:
          type: string
        Writer:
          type: string
        Actors:
          type: string
        Plot:
          type: string
        Language:
          type: string
        Country:
          type: string
        Awards:
          type: string
        Poster:
          type: string
          description: Poster URL on img.amodb.dev, or N/A.
        Ratings:
          type: array
          items:
            $ref: '#/components/schemas/OmdbRating'
          description: 'Only the sources that have a value: Internet Movie Database, Rotten Tomatoes, Metacritic.'
        Metascore:
          type: string
        imdbRating:
          type: string
        imdbVotes:
          type: string
        imdbID:
          type: string
        Type:
          type: string
          enum: [movie]
        DVD:
          type: string
          description: Always N/A.
        BoxOffice:
          type: string
        Production:
          type: string
          description: Always N/A.
        Website:
          type: string
          description: Always N/A.
        Response:
          type: string
          enum: ['True']
      required: [Title, Year, Rated, Released, Runtime, Genre, Director, Writer, Actors, Plot, Language, Country, Awards, Poster, Ratings, Metascore, imdbRating, imdbVotes, imdbID, Type, DVD, BoxOffice, Production, Website, Response]
    OmdbSeries:
      type: object
      description: One TV series. Every value is a string. It has totalSeasons and no DVD, BoxOffice, Production or Website.
      properties:
        Title:
          type: string
        Year:
          type: string
          description: A year, or a range such as 2008 to 2013 written with an en dash, or an open range for a running show.
        Rated:
          type: string
        Released:
          type: string
        Runtime:
          type: string
        Genre:
          type: string
        Director:
          type: string
        Writer:
          type: string
        Actors:
          type: string
        Plot:
          type: string
        Language:
          type: string
        Country:
          type: string
        Awards:
          type: string
        Poster:
          type: string
          description: Poster URL on img.amodb.dev, or N/A.
        Ratings:
          type: array
          items:
            $ref: '#/components/schemas/OmdbRating'
        Metascore:
          type: string
        imdbRating:
          type: string
        imdbVotes:
          type: string
        imdbID:
          type: string
        Type:
          type: string
          enum: [series]
        totalSeasons:
          type: string
        Response:
          type: string
          enum: ['True']
      required: [Title, Year, Rated, Released, Runtime, Genre, Director, Writer, Actors, Plot, Language, Country, Awards, Poster, Ratings, Metascore, imdbRating, imdbVotes, imdbID, Type, totalSeasons, Response]
    OmdbSearchItem:
      type: object
      properties:
        Title:
          type: string
        Year:
          type: string
        imdbID:
          type: string
        Type:
          type: string
          enum: [movie, series]
        Poster:
          type: string
          description: Poster URL on img.amodb.dev, or N/A.
      required: [Title, Year, imdbID, Type, Poster]
    OmdbSearchResult:
      type: object
      description: One page of search results.
      properties:
        Search:
          type: array
          items:
            $ref: '#/components/schemas/OmdbSearchItem'
        totalResults:
          type: string
          description: Total matches as a string. Ten items per page.
        Response:
          type: string
          enum: ['True']
      required: [Search, totalResults, Response]
    OmdbError:
      type: object
      description: Error body of the OMDb route.
      properties:
        Response:
          type: string
          enum: ['False']
        Error:
          type: string
      required: [Response, Error]
  parameters:
    language:
      name: language
      in: query
      description: 'Language tag, for example en-US, ru-RU or pt-BR. Fourteen base languages are served: en, ru, uk, be, zh, pt, bg, he, cs, ro, fr, pl, it, es (tags en-US, ru-RU, uk-UA, be-BY, zh-CN, pt-BR, bg-BG, he-IL, cs-CZ, ro-RO, fr-FR, pl-PL, it-IT, es-ES). A bare code such as ru works too, and the legacy code iw maps to he. Any other value falls back to en.'
      schema:
        type: string
        default: en-US
      example: en-US
    page:
      name: page
      in: query
      description: Page number, from 1 up to 500.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 1
      example: 1
    append_to_response_movie:
      name: append_to_response
      in: query
      description: 'Comma separated sub requests merged into the response, at most 20. Allowed names for a movie: credits, images, videos, keywords, translations, external_ids, similar, recommendations, reviews, release_dates, watch/providers, alternative_titles, lists, moods, soundtracks, ratings, wikidata, showtimes. A name that is not in this list is ignored. Each appended section has the shape of its own endpoint. The id is dropped from every appended section except wikidata and showtimes, which keep it.'
      schema:
        type: array
        items:
          type: string
          enum: [credits, images, videos, keywords, translations, external_ids, similar, recommendations, reviews, release_dates, watch/providers, alternative_titles, lists, moods, soundtracks, ratings, wikidata, showtimes]
        maxItems: 20
        uniqueItems: true
      style: form
      explode: false
      example: [credits, external_ids]
    append_to_response_tv:
      name: append_to_response
      in: query
      description: 'Comma separated sub requests merged into the response, at most 20. Allowed names for a TV show: credits, images, videos, keywords, translations, external_ids, similar, recommendations, reviews, content_ratings, watch/providers, alternative_titles, lists, episode_groups, moods, soundtracks, ratings, wikidata, showtimes. A name that is not in this list is ignored. Each appended section has the shape of its own endpoint. The id is dropped from every appended section except wikidata and showtimes, which keep it.'
      schema:
        type: array
        items:
          type: string
          enum: [credits, images, videos, keywords, translations, external_ids, similar, recommendations, reviews, content_ratings, watch/providers, alternative_titles, lists, episode_groups, moods, soundtracks, ratings, wikidata, showtimes]
        maxItems: 20
        uniqueItems: true
      style: form
      explode: false
      example: [content_ratings, external_ids]
    append_to_response_person:
      name: append_to_response
      in: query
      description: 'Comma separated sub requests merged into the response, at most 20. Allowed names for a person: combined_credits, movie_credits, tv_credits, external_ids, images. A name that is not in this list is ignored. Each appended section has the shape of its own endpoint. The id is dropped from every appended section.'
      schema:
        type: array
        items:
          type: string
          enum: [combined_credits, movie_credits, tv_credits, external_ids, images]
        maxItems: 20
        uniqueItems: true
      style: form
      explode: false
      example: [combined_credits, external_ids]
    append_to_response_season:
      name: append_to_response
      in: query
      description: 'Comma separated sub requests merged into the response, at most 20. Allowed names for a season: credits, images, videos, external_ids. A name that is not in this list is ignored. Each appended section has the shape of its own endpoint. The id is dropped from every appended section.'
      schema:
        type: array
        items:
          type: string
          enum: [credits, images, videos, external_ids]
        maxItems: 20
        uniqueItems: true
      style: form
      explode: false
      example: [credits]
    append_to_response_episode:
      name: append_to_response
      in: query
      description: 'Comma separated sub requests merged into the response, at most 20. Allowed names for an episode: credits, images, videos, external_ids, translations. A name that is not in this list is ignored. Each appended section has the shape of its own endpoint. The id is dropped from every appended section.'
      schema:
        type: array
        items:
          type: string
          enum: [credits, images, videos, external_ids, translations]
        maxItems: 20
        uniqueItems: true
      style: form
      explode: false
      example: [credits, translations]
    region:
      name: region
      in: query
      description: ISO 3166-1 country code that narrows the list to titles released there, for example US.
      schema:
        type: string
        pattern: ^[A-Z]{2}$
      example: US
    timezone:
      name: timezone
      in: query
      description: IANA timezone that defines the day, for example America/New_York.
      schema:
        type: string
      example: America/New_York
    include_image_language:
      name: include_image_language
      in: query
      description: Comma separated two letter language codes to keep, for example en,null. Add null for images without text. All languages are returned when it is missing. The language parameter does not filter images.
      schema:
        type: string
      example: en,null
    query_movie:
      name: query
      in: query
      required: true
      description: Movie title to search for. A request without it returns an empty page.
      schema:
        type: string
        minLength: 1
      example: inception
    query_tv:
      name: query
      in: query
      required: true
      description: TV show name to search for. A request without it returns an empty page.
      schema:
        type: string
        minLength: 1
      example: breaking bad
    query_person:
      name: query
      in: query
      required: true
      description: Person name to search for. A request without it returns an empty page.
      schema:
        type: string
        minLength: 1
      example: brad pitt
    query_multi:
      name: query
      in: query
      required: true
      description: Text to search for across movies, shows and people. A request without it returns an empty page.
      schema:
        type: string
        minLength: 1
      example: fight club
    query_collection:
      name: query
      in: query
      required: true
      description: Collection name to search for. A request without it returns an empty page.
      schema:
        type: string
        minLength: 1
      example: batman
    query_company:
      name: query
      in: query
      required: true
      description: Company name to search for. A request without it returns an empty page.
      schema:
        type: string
        minLength: 1
      example: warner
    query_keyword:
      name: query
      in: query
      required: true
      description: Keyword to search for. A request without it returns an empty page.
      schema:
        type: string
        minLength: 1
      example: space
    showtimes_country:
      name: country
      in: query
      description: ISO 3166-1 country code, for example RU. Without a valid country the response has only the per country totals in countries. With one, results lists the venues.
      schema:
        type: string
        pattern: ^[A-Za-z]{2}$
      example: RU
    showtimes_region:
      name: region
      in: query
      description: Alias of country. country wins when both are sent.
      schema:
        type: string
        pattern: ^[A-Za-z]{2}$
      example: RU
    movie_id:
      name: movie_id
      in: path
      required: true
      description: Movie id.
      schema:
        type: integer
        minimum: 1
      example: 550
    series_id:
      name: series_id
      in: path
      required: true
      description: TV show id.
      schema:
        type: integer
        minimum: 1
      example: 1396
    season_number:
      name: season_number
      in: path
      required: true
      description: Season number. 0 is the specials season.
      schema:
        type: integer
        minimum: 0
      example: 1
    episode_number:
      name: episode_number
      in: path
      required: true
      description: Episode number inside the season.
      schema:
        type: integer
        minimum: 1
      example: 1
    person_id:
      name: person_id
      in: path
      required: true
      description: Person id.
      schema:
        type: integer
        minimum: 1
      example: 287
    collection_id:
      name: collection_id
      in: path
      required: true
      description: Collection id.
      schema:
        type: integer
        minimum: 1
      example: 10
    company_id:
      name: company_id
      in: path
      required: true
      description: Company id.
      schema:
        type: integer
        minimum: 1
      example: 25
    network_id:
      name: network_id
      in: path
      required: true
      description: Network id.
      schema:
        type: integer
        minimum: 1
      example: 49
    keyword_id:
      name: keyword_id
      in: path
      required: true
      description: Keyword id.
      schema:
        type: integer
        minimum: 1
      example: 818
    external_id:
      name: external_id
      in: path
      required: true
      description: Id in the system named by external_source, for example tt0137523. One to 64 characters from letters, digits, underscore, dot, at sign and hyphen.
      schema:
        type: string
        pattern: ^[A-Za-z0-9_.@-]{1,64}$
      example: tt0137523
    media_type:
      name: media_type
      in: path
      required: true
      description: Kind of title to rank.
      schema:
        type: string
        enum: [all, movie, tv, person]
      example: all
    time_window:
      name: time_window
      in: path
      required: true
      description: Ranking window.
      schema:
        type: string
        enum: [day, week]
      example: day
  headers:
    RateLimitLimit:
      description: Requests allowed per minute for the key.
      schema:
        type: integer
      example: 40
    RateLimitRemaining:
      description: Requests left in the current window.
      schema:
        type: integer
      example: 39
    RateLimitReset:
      description: Seconds until the window frees a slot.
      schema:
        type: integer
      example: 60
    RetryAfter:
      description: Seconds to wait before the next request.
      schema:
        type: integer
      example: 12
  examples:
    InvalidApiKey:
      summary: Invalid key
      value:
        success: false
        status_code: 7
        status_message: 'Invalid API key: You must be granted a valid key.'
    SuspendedApiKey:
      summary: Suspended key
      value:
        success: false
        status_code: 10
        status_message: 'Suspended API key: Access to your account has been suspended, contact amodb.'
    InvalidParameters:
      summary: Missing or unknown external_source, or a bad id
      value:
        success: false
        status_code: 22
        status_message: 'Invalid parameters: Your request parameters are incorrect.'
    ResourceNotFound:
      summary: Unknown id, wrong kind of title or a path amodb does not offer
      value:
        success: false
        status_code: 34
        status_message: The resource you requested could not be found.
    MethodNotOffered:
      summary: Account, session, list or rating route
      value:
        success: false
        status_code: 37
        status_message: This method is not offered by amodb.
  responses:
    Unauthorized:
      description: The key is missing, invalid (code 7) or suspended (code 10).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidKey:
              $ref: '#/components/examples/InvalidApiKey'
            suspendedKey:
              $ref: '#/components/examples/SuspendedApiKey'
    PlanExpired:
      description: The plan of the key has expired (code 36).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            status_code: 36
            status_message: Your plan has expired. Renew at https://amodb.dev/pricing
    BadRequest:
      description: The request parameters are incorrect (code 22). find answers this way when external_source is missing or unknown, or when the id is longer than 64 characters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidParameters:
              $ref: '#/components/examples/InvalidParameters'
    NotFound:
      description: The resource does not exist (code 34). It also answers a path amodb does not offer, a sub resource of the wrong kind (for example release_dates of a TV show) and adult titles.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notFound:
              $ref: '#/components/examples/ResourceNotFound'
    MethodNotAllowed:
      description: The route is not offered (code 37). Everything under account, authentication, guest_session and list, and any path that ends in /account_states or /rating, answers this way.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notOffered:
              $ref: '#/components/examples/MethodNotOffered'
    RateLimited:
      description: The key went over its requests per minute (code 25). Wait Retry-After seconds.
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            status_code: 25
            status_message: Your request count (41) is over the allowed limit of (40).
    InternalError:
      description: Internal error (code 11).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            status_code: 11
            status_message: 'Internal error: Something went wrong, contact amodb.'
    RequestTimeout:
      description: The request timed out (code 24). Try again.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            status_code: 24
            status_message: Your request to the backend server timed out. Try again.
  securitySchemes:
    api_key:
      type: apiKey
      in: query
      name: api_key
      description: Your key in the api_key query parameter, as in TMDB v3. 32 lowercase hex characters.
    bearer:
      type: http
      scheme: bearer
      description: 'Your key in the Authorization header: Authorization: Bearer KEY.'
    apikey:
      type: apiKey
      in: query
      name: apikey
      description: Your key in the apikey query parameter. Used only by the OMDb route.
