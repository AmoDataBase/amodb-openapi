components:
  schemas:
    Error:
      type: object
      description: Error body used by every TMDB style route. The status_code values are listed in the responses of this document.
      required: [success, status_code, status_message]
      properties:
        success:
          type: boolean
          const: false
        status_code:
          type: integer
          description: 'amodb status code. Known values: 7, 10, 11, 22, 24, 25, 34, 36 and 37.'
        status_message:
          type: string
      example:
        success: false
        status_code: 34
        status_message: The resource you requested could not be found.
    Genre:
      type: object
      example:
        id: 18
        name: Drama
      properties:
        id:
          type: integer
        name:
          type: string
      required: [id, name]
    GenreList:
      type: object
      properties:
        genres:
          type: array
          items:
            $ref: '#/components/schemas/Genre'
      required: [genres]
    ProductionCompany:
      type: object
      properties:
        id:
          type: integer
        logo_path:
          type: [string, 'null']
        name:
          type: string
        origin_country:
          type: string
      required: [id, logo_path, name, origin_country]
    ProductionCountry:
      type: object
      properties:
        iso_3166_1:
          type: string
        name:
          type: string
      required: [iso_3166_1, name]
    SpokenLanguage:
      type: object
      properties:
        english_name:
          type: string
        iso_639_1:
          type: string
        name:
          type: string
      required: [english_name, iso_639_1, name]
    Image:
      type: object
      description: One image file. The width and height of episode stills are 0.
      properties:
        aspect_ratio:
          type: number
        height:
          type: integer
        iso_639_1:
          type: [string, 'null']
          description: Language of the text on the image, null when it has none.
        file_path:
          type: string
          description: Append to the image base URL and a size, for example /t/p/w500/{file_path}.
        vote_average:
          type: number
        vote_count:
          type: integer
        width:
          type: integer
      required: [aspect_ratio, height, iso_639_1, file_path, vote_average, vote_count, width]
    TitleImages:
      type: object
      description: Images of a movie or TV show. The id is present on the direct endpoint and absent inside append_to_response.
      properties:
        id:
          type: integer
        backdrops:
          type: array
          items:
            $ref: '#/components/schemas/Image'
        logos:
          type: array
