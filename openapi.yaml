tags:
  - name: Movies
    description: Movie details and the data attached to a movie.
  - name: Movie lists
    description: Popular, top rated, upcoming and now playing movies.
  - name: TV shows
    description: TV show details and the data attached to a show.
  - name: TV lists
    description: Popular, top rated, airing today and on the air shows.
  - name: Seasons
    description: Season details and the data attached to a season.
  - name: Episodes
    description: Episode details and the data attached to an episode.
  - name: People
    description: Person details, credits and popular people.
  - name: Search
    description: Text search across movies, shows, people, collections, companies and keywords.
  - name: Discover
    description: Filtered and sorted lists of movies and shows.
  - name: Trending
    description: Trending movies, shows and people.
  - name: Genres
    description: Genre ids and names.
  - name: Collections
    description: Movie collections.
  - name: Companies
    description: Production companies.
  - name: Networks
    description: TV networks.
  - name: Keywords
    description: Keywords and the movies tagged with them.
  - name: Find
    description: Look up titles by an id from another system.
  - name: Configuration
    description: Image base URLs, size lists and reference data.
  - name: Certifications
    description: Age rating lists by country.
  - name: Watch providers
    description: Provider catalogs and regions.
  - name: Reviews
    description: Single review lookup.
  - name: Credits
    description: Single credit lookup.
  - name: Extensions
    description: 'Routes that exist only in amodb: `moods`, `soundtracks`, `ratings`, `wikidata` and `showtimes`.'
  - name: OMDb
    description: OMDb compatible lookup and search.
  - name: Images
    description: Image files on the image host.
  - name: Plans
    description: Public list of plans and prices.
x-tagGroups:
  - name: TMDB compatible
    tags: [Movies, Movie lists, TV shows, TV lists, Seasons, Episodes, People, Search, Discover, Trending, Genres, Collections, Companies, Networks, Keywords, Find, Configuration, Certifications, Watch providers, Reviews, Credits]
  - name: amodb extensions
    tags: [Extensions]
  - name: OMDb compatible
    tags: [OMDb]
  - name: Images and plans
    tags: [Images, Plans]
paths:
  /3/movie/{movie_id}:
    get:
      tags: [Movies]
      summary: Get movie details
      operationId: getMovieDetails
      description: Returns one movie. Merge sub requests with `append_to_response`, for example `credits,images`. amodb also accepts `moods`, `soundtracks`, `ratings`, `wikidata` and `showtimes`.
      parameters:
        - $ref: '#/components/parameters/movie_id'
        - $ref: '#/components/parameters/language'
        - $ref: '#/components/parameters/append_to_response'
      responses:
        '200':
          description: OK
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieDetails'
              example:
                adult: false
                backdrop_path: /hZkgoQYus5vegHoetLkCJzb17zJ.jpg
                belongs_to_collection: null
                budget: 63000000
                genres:
                  - id: 18
                    name: Drama
                  - id: 53
                    name: Thriller
                  - id: 35
                    name: Comedy
                homepage: ''
                id: 550
                imdb_id: tt0137523
                origin_country: [US]
                original_language: en
                original_title: Fight Club
                overview: An insomniac office worker and a soap maker start an underground fight club that grows into something bigger.
                popularity: 28.4
                poster_path: /pB8BM7pdSp6B6Ih7QZ4DrQ3PmJK.jpg
                production_countries:
                  - iso_3166_1: US
                    name: United States of America
                release_date: '1999-10-15'
                revenue: 100853753
                runtime: 139
                spoken_languages:
                  - english_name: English
                    iso_639_1: en
                    name: English
                status: Released
                title: Fight Club
                video: false
                vote_average: 8.4
                vote_count: 29500
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PlanExpired'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/RequestTimeout'
  /3/movie/{movie_id}/alternative_titles:
    get:
      tags: [Movies]
      summary: Get alternative titles
      operationId: getMovieAlternativeTitles
      description: Titles of the movie in other countries.
