                  summary: None of i, t and s, HTTP 200
                  value:
                    Response: 'False'
                    Error: Something went wrong.
        '400':
          description: The r parameter is not json.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OmdbError'
              example:
                Response: 'False'
                Error: Only r=json is supported.
        '401':
          description: The key is missing (No API key provided.) or invalid (Invalid API key!).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OmdbError'
              examples:
                missingKey:
                  summary: No key
                  value:
                    Response: 'False'
                    Error: No API key provided.
                invalidKey:
                  summary: Invalid key
                  value:
                    Response: 'False'
                    Error: Invalid API key!
        '402':
          description: The plan of the key has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OmdbError'
              example:
                Response: 'False'
                Error: Your plan has expired. Renew at https://amodb.dev/pricing
        '429':
          description: The key went over its requests per minute. Wait Retry-After seconds.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OmdbError'
              example:
                Response: 'False'
                Error: Request limit reached!
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OmdbError'
              example:
                Response: 'False'
                Error: 'Internal error: Something went wrong, contact amodb.'
        '504':
          description: The request timed out.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OmdbError'
              example:
                Response: 'False'
                Error: Your request to the backend server timed out. Try again.
  /t/p/{size}/{file}:
    get:
      tags: [Images]
      summary: Get an image
      operationId: getImage
      description: Serves an image on the img.amodb.dev host. No key is needed. Build the path from images.secure_base_url in /3/configuration, a size and the file_path of an image without its leading slash. An unknown size or file answers 404 with the TMDB error body.
      security: []
      servers:
        - url: https://img.amodb.dev
          description: Image host
      parameters:
        - name: size
          in: path
          required: true
          description: Image size. w is the width in pixels, h632 is the height, original is the source file. Which sizes suit which kind of image is listed in /3/configuration.
          schema:
            type: string
            enum: [w92, w154, w185, w300, w342, w500, w780, w1280, h632, original]
          example: w500
        - name: file
          in: path
          required: true
          description: File name from a file_path, without the leading slash.
          schema:
            type: string
          example: pB8BM7pdSp6B6Ih7QZ4DrQ3PmJK.jpg
      responses:
        '200':
          description: The image bytes. Responses are cached for a long time.
          headers:
            Cache-Control:
              description: Long lived cache directive.
              schema:
                type: string
              example: public, max-age=2592000
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
