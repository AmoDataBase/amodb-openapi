  /omdb/:
    get:
      tags: [OMDb]
      summary: Look up or search titles
      operationId: queryOmdb
      description: 'OMDb compatible route. Send `i` for an IMDb id, `t` for a title, or `s` to search. Every value in the response is a string. Errors are HTTP 200 with `{"Response": "False", "Error": "..."}`, for example Movie not found!, Incorrect IMDb ID., Too many results. (a search under 3 letters or too broad) and Something went wrong. (none of i, t and s). The one exception is `r` other than json, which answers 400. Episodes and seasons are not offered, so `type=episode` finds nothing. The trailing slash is optional.'
      security:
        - apikey: []
      parameters:
        - name: i
          in: query
          description: IMDb id, 7 to 9 digits after tt. Returns one title.
          schema:
            type: string
            pattern: ^tt[0-9]{7,9}$
          example: tt0137523
        - name: t
          in: query
          description: Title to look up. Returns one title.
          schema:
            type: string
          example: Fight Club
        - name: s
          in: query
          description: Title to search for. Returns a page of results, 10 per page. Needs at least 3 letters.
          schema:
            type: string
          example: inception
        - name: type
          in: query
          description: Kind of title.
          schema:
            type: string
            enum: [movie, series]
          example: movie
        - name: 'y'
          in: query
          description: Release year.
          schema:
            type: string
            pattern: ^[0-9]{4}$
          example: '1999'
        - name: plot
          in: query
          description: Length of the Plot field.
          schema:
            type: string
            enum: [short, full]
            default: short
        - name: page
          in: query
          description: Page of search results, 10 per page. Used with s.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 1
        - name: r
          in: query
          description: Response format. Only json is offered. Any other value answers 400.
          schema:
            type: string
            enum: [json]
            default: json
      responses:
        '200':
          description: One title, a page of search results, or an OMDb error with Response False.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/OmdbMovie'
                  - $ref: '#/components/schemas/OmdbSeries'
                  - $ref: '#/components/schemas/OmdbSearchResult'
                  - $ref: '#/components/schemas/OmdbError'
              examples:
                movie:
                  summary: Movie by IMDb id
                  value:
                    Title: Fight Club
                    Year: '1999'
                    Rated: R
                    Released: 15 Oct 1999
                    Runtime: 139 min
                    Genre: Crime, Drama, Thriller
                    Director: David Fincher
                    Writer: Chuck Palahniuk, Jim Uhls
                    Actors: Brad Pitt, Edward Norton, Meat Loaf
                    Plot: A nameless first-person narrator attends support groups in an attempt to subdue his emotional state and relieve his i...
                    Language: English
                    Country: United States, Germany
                    Awards: Nominated for 1 Oscar. 12 wins & 38 nominations total
                    Poster: https://img.amodb.dev/t/p/w300/qkrH7rjYKU4KOwwIl6wF6H3ISvm.jpg
                    Ratings:
                      - Source: Internet Movie Database
                        Value: 8.8/10
                      - Source: Rotten Tomatoes
                        Value: 81%
                    Metascore: '67'
                    imdbRating: '8.8'
                    imdbVotes: 2,669,989
                    imdbID: tt0137523
                    Type: movie
                    DVD: N/A
                    BoxOffice: $38,003,039
                    Production: N/A
                    Website: N/A
                    Response: 'True'
                movieFull:
                  summary: Movie with plot=full
                  value:
                    Title: Fight Club
                    Year: '1999'
                    Rated: R
                    Released: 15 Oct 1999
                    Runtime: 139 min
                    Genre: Crime, Drama, Thriller
                    Director: David Fincher
                    Writer: Chuck Palahniuk, Jim Uhls
                    Actors: Brad Pitt, Edward Norton, Meat Loaf
                    Plot: A nameless first-person narrator attends support groups in an attempt to subdue his emotional state and relieve his i...
                    Language: English
                    Country: United States, Germany
                    Awards: Nominated for 1 Oscar. 12 wins & 38 nominations total
                    Poster: https://img.amodb.dev/t/p/w300/qkrH7rjYKU4KOwwIl6wF6H3ISvm.jpg
                    Ratings:
                      - Source: Internet Movie Database
                        Value: 8.8/10
                      - Source: Rotten Tomatoes
                        Value: 81%
