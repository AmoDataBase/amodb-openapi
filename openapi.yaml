  headers:
    RateLimitLimit:
      description: Requests allowed per minute for the key.
      schema:
        type: integer
      example: 40
    RateLimitRemaining:
      description: Requests left in the current window.
      schema:
        type: integer
      example: 39
    RateLimitReset:
      description: Seconds until the window frees a slot.
      schema:
        type: integer
      example: 60
    RetryAfter:
      description: Seconds to wait before the next request.
      schema:
        type: integer
      example: 12
  examples:
    InvalidApiKey:
      summary: Invalid key
      value:
        success: false
        status_code: 7
        status_message: 'Invalid API key: You must be granted a valid key.'
    SuspendedApiKey:
      summary: Suspended key
      value:
        success: false
        status_code: 10
        status_message: 'Suspended API key: Access to your account has been suspended, contact amodb.'
  responses:
    Unauthorized:
      description: The key is missing, invalid (code 7) or suspended (code 10).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidKey:
              $ref: '#/components/examples/InvalidApiKey'
            suspendedKey:
              $ref: '#/components/examples/SuspendedApiKey'
    PlanExpired:
      description: The plan of the key has expired (code 36).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            status_code: 36
            status_message: Your plan has expired. Renew at https://amodb.dev/pricing
    NotFound:
      description: The resource does not exist (code 34).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            status_code: 34
            status_message: The resource you requested could not be found.
    MethodNotAllowed:
      description: The method is not offered (code 37). TMDB write methods return this response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            status_code: 37
            status_message: This method is not offered by amodb.
    RateLimited:
      description: The key went over its requests per minute (code 25). Wait Retry-After seconds.
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            status_code: 25
            status_message: Your request count (41) is over the allowed limit of (40).
    InternalError:
      description: Internal error (code 11).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            status_code: 11
            status_message: 'Internal error: Something went wrong, contact amodb.'
    RequestTimeout:
      description: The request timed out (code 24). Try again.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            status_code: 24
            status_message: Your request to the backend server timed out. Try again.
  securitySchemes:
    api_key:
      type: apiKey
      in: query
      name: api_key
      description: Your key in the api_key query parameter, as in TMDB v3. 32 lowercase hex characters.
    bearer:
      type: http
      scheme: bearer
      description: 'Your key in the Authorization header: Authorization: Bearer KEY.'
    apikey:
      type: apiKey
      in: query
      name: apikey
      description: Your key in the apikey query parameter. Used only by the OMDb route.
