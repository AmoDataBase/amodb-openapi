      in: path
      required: true
      description: Collection id.
      schema:
        type: integer
        minimum: 1
      example: 10
    company_id:
      name: company_id
      in: path
      required: true
      description: Company id.
      schema:
        type: integer
        minimum: 1
      example: 1
    network_id:
      name: network_id
      in: path
      required: true
      description: Network id.
      schema:
        type: integer
        minimum: 1
      example: 1
    keyword_id:
