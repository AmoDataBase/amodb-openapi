  description: amodb website and pricing
  url: https://amodb.dev
servers:
  - url: https://api.amodb.dev
    description: Production
security:
  - api_key: []
  - bearer: []
tags:
  - name: Movies
    description: Movie details, the data attached to a movie, and the newest movie.
  - name: Movie lists
    description: Popular, top rated, upcoming and now playing movies.
  - name: TV shows
    description: TV show details, the data attached to a show, and the newest show.
  - name: TV lists
    description: Popular, top rated, airing today and on the air shows.
  - name: Seasons
    description: Season details and the data attached to a season.
  - name: Episodes
    description: Episode details and the data attached to an episode.
  - name: People
    description: Person details, credits and popular people. There is no latest person and no person translations.
  - name: Search
    description: Text search across movies, shows, people, collections, companies and keywords. include_adult is ignored.
  - name: Discover
    description: Filtered and sorted lists of movies and shows.
  - name: Trending
    description: Trending movies, shows and people.
  - name: Genres
    description: Genre ids and names.
  - name: Collections
    description: Movie collections. Images and translations of collections are not offered.
  - name: Companies
    description: Production companies. Images, translations and alternative names are not offered.
  - name: Networks
    description: TV networks. Images, translations and alternative names are not offered.
  - name: Keywords
    description: Keywords and the movies tagged with them.
  - name: Find
    description: Look up titles and people by an id from another system. Twelve external_source values are accepted.
  - name: Configuration
    description: Image base URLs, size lists and reference data. There is no timezones list.
  - name: Certifications
    description: Age rating lists by country.
  - name: Watch providers
    description: Provider catalogs and regions.
  - name: Extensions
    description: 'Routes that exist only in amodb: `moods`, `soundtracks`, `ratings`, `wikidata` and `showtimes`.'
  - name: OMDb
    description: OMDb compatible lookup and search.
  - name: Images
    description: Image files on the image host.
  - name: Plans
    description: Public list of plans and prices.
x-tagGroups:
  - name: TMDB compatible
    tags: [Movies, Movie lists, TV shows, TV lists, Seasons, Episodes, People, Search, Discover, Trending, Genres, Collections, Companies, Networks, Keywords, Find, Configuration, Certifications, Watch providers]
  - name: amodb extensions
    tags: [Extensions]
  - name: OMDb compatible
    tags: [OMDb]
  - name: Images and plans
    tags: [Images, Plans]
paths:
  /3/movie/{movie_id}:
    get:
      tags: [Movies]
      summary: Get movie details
      operationId: getMovieDetails
      description: Returns one movie. Merge sub requests with `append_to_response`, for example `credits,external_ids`. The standard names are credits, images, videos, keywords, translations, external_ids, similar, recommendations, reviews, release_dates, watch/providers, alternative_titles and lists. amodb adds `moods`, `soundtracks`, `ratings`, `wikidata` and `showtimes`. Appended `moods`, `soundtracks` and `ratings` have no `id`. Appended `wikidata` and `showtimes` keep it. Adult titles answer 404.
      parameters:
        - $ref: '#/components/parameters/movie_id'
        - $ref: '#/components/parameters/language'
        - $ref: '#/components/parameters/append_to_response_movie'
      responses:
        '200':
          description: OK
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
