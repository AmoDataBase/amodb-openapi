  parameters:
    language:
      name: language
      in: query
      description: 'Language tag, for example en-US, ru-RU or pt-BR. Fourteen base languages are served: en, ru, uk, be, zh, pt, bg, he, cs, ro, fr, pl, it, es. Any other value falls back to en.'
      schema:
        type: string
        default: en-US
      example: en-US
    page:
      name: page
      in: query
      description: Page number. Lists have at most 500 pages.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 1
      example: 1
    append_to_response:
      name: append_to_response
      in: query
      description: Comma separated sub requests merged into the response, at most 20. Use endpoint names such as credits, images, videos or external_ids. amodb also accepts `moods`, `soundtracks`, `ratings`, `wikidata` and `showtimes`.
      schema:
        type: string
      example: credits,images
    region:
      name: region
      in: query
      description: ISO 3166-1 country code that narrows release dates and lists, for example US.
      schema:
        type: string
        pattern: ^[A-Z]{2}$
      example: US
    include_adult:
      name: include_adult
      in: query
      description: Include adult titles in the results.
      schema:
        type: boolean
        default: false
    include_image_language:
      name: include_image_language
      in: query
      description: Comma separated language codes to keep, for example en,null. Add null for images without text.
      schema:
        type: string
      example: en,null
    include_video_language:
      name: include_video_language
      in: query
      description: Comma separated language codes to keep, for example en,ru.
      schema:
        type: string
      example: en
    query:
      name: query
      in: query
      required: true
      description: Text to search for.
      schema:
        type: string
        minLength: 1
      example: inception
    movie_id:
